# =============================================================================
# Konfiguracija pipeline-a za prikupljanje i pripremu srpskog dataseta
# (analiza sentimenta sa detekcijom sarkazma)
# =============================================================================

dataset:
  # Maksimalan broj finalnih uzoraka nakon preprocesiranja i deduplikacije
  max_total_samples: 2000
  # Koliko sirovih uzoraka prikupiti više od finalnog limita (buffer za filtriranje)
  raw_oversample_factor: 1.5
  # Dozvoljene vrednosti labela (ručna anotacija; pipeline ih NE popunjava)
  sentiment_labels: ["1", "0", "-1"]
  sarcasm_labels: ["1", "0"]

# Maksimalan broj uzoraka po izvoru u finalnom datasetu (pre balansiranja ukupnog limita)
per_source_limits:
  youtube: 1500
  twitter: 800
  tiktok: 800
  instagram: 800
  reddit: 400
  reviews: 300

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  external_dir: data/external
  annotation_csv: data/processed/annotation/annotation_template.csv
  dataset_csv: data/processed/dataset/dataset.csv
  dataset_jsonl: data/processed/dataset/dataset.jsonl
  stats_json: data/processed/dataset/dataset_stats.json
  splits_dir: data/processed/splits
  twitter_csv: data/processed/sources/twitter_comments.csv
  youtube_csv: data/processed/sources/youtube_comments.csv
  instagram_csv: data/processed/sources/instagram_comments.csv
  scratch_dir: data/processed/scratch

language:
  # Filtriranje na srpski (i blisko srodne BCMS varijante ako je omogućeno)
  enabled: true
  # dozvoljeni ISO 639-1 / langdetect kodovi
  allowed_codes: [sr, hr, bs]
  # Ako je true, tekstovi sa nepouzdanom detekcijom jezika se zadržavaju
  keep_unknown: true
  # Minimalna pouzdanost langdetect (0-1); ispod praga tretira se kao unknown
  min_confidence: 0.5
  # Minimalna dužina teksta (u karakterima) nakon čišćenja
  min_text_length: 15
  # Maksimalna dužina teksta (karakteri); duži se odbacuju
  max_text_length: 2000

collection:
  # Koje kolektore pokrenuti u run_collection
  # Dataset je samostalan (bez SentiComments.SR)
  enabled_sources:
    - youtube
    - twitter
    - tiktok
    - instagram
    - reddit
    - reviews

  youtube:
    # Zahteva YOUTUBE_API_KEY u .env
    # Append u POSEBAN CSV (kao twitter):
    #   python scripts/collection/append_youtube.py --tip filmovi
    #   python scripts/collection/append_youtube.py --tip politika --url "https://www.youtube.com/watch?v=ID"
    video_ids: []
    video_ids_file: config/sources/youtube_video_ids.txt
    output_csv: data/processed/sources/youtube_comments.csv
    max_comments_per_video: 300
    include_replies: false
    # Samo tekst komentara; bez username / channelId autora
    request_timeout_seconds: 30

  twitter:
    # Automatski fetch replies (twikit) u POSEBAN CSV:
    #   python scripts/collection/append_twitter.py --tip politika
    # Ručno: --manual. Cookies: data/external/twitter/session/cookies.json
    comments_dir: data/external/twitter/
    output_csv: data/processed/sources/twitter_comments.csv
    urls_file: config/sources/twitter_urls.txt
    cookies_file: data/external/twitter/session/cookies.json
    source_label: twitter

  tiktok:
    # Nema browser scrapinga (ToS). Koristi se rucni / polu-rucni unos:
    # scripts/collection/append_tiktok.py --url "..." --comments-file putanja.txt
    comments_dir: data/external/tiktok/
    source_label: tiktok

  instagram:
    # Nema logina/scrapinga (ToS). Polu-rucni unos kao TikTok:
    # scripts/collection/append_instagram.py --url "..." --comments-file putanja.txt
    # Zvanicni put za app-ove: Meta Graph API (sa odobrenjem).
    comments_dir: data/external/instagram/
    source_label: instagram

  reddit:
    # Akademsko istraživanje: Reddit for Researchers (RFR).
    # Ovaj kolektor NE scrape-uje Reddit i NE zaobilazi autentifikaciju.
    # Podržava učitavanje odobrenog ekspora (JSONL/CSV) dobijenog formalnim putem.
    export_path: data/external/reddit/export.jsonl
    text_column: text
    # Opciono: kolona sa ID-jem komentara (ako postoji u eksportu)
    id_column: id
    # Polu-rucni unos (kao TikTok):
    # scripts/collection/append_reddit.py --url "..." --comments-file putanja.txt
    comments_dir: data/external/reddit/

  reviews:
    # Generički učitavač javno dostupnih recenzija/komentara iz lokalnih fajlova
    # (korisnik obezbeđuje podatke u skladu sa ToS izvora)
    input_paths:
      - data/external/reviews/
    # Podržani formati: .csv, .tsv, .jsonl, .json, .txt
    text_column: text
    source_label: reviews

# Lagano čišćenje pri kolekciji / build dataseta.
# ISTI tekst ide u BERTić (bez dodatnog baseline pretprocesiranja).
preprocessing:
  remove_emojis: true
  remove_mentions: true  # skini @username (npr. @n1srbija u reply-ima)
  normalize_whitespace: true
  replace_urls_with: "[URL]"
  strip_html: true
  # Interpunkcija se ZADRŽAVA (važna za sarkazam)
  remove_punctuation: false
  remove_stopwords: false
  # Latinica i ćirilica se NE konvertuju jedna u drugu
  transliterate: false
  # Exact duplicate detection na normalizovanom tekstu
  deduplicate: true

# Samo za klasične ML baseline modele (TF-IDF + LR/SVM/NB).
# BERTić / transformer pipeline OVO NE KORISTI.
# CLI: python scripts/preprocessing/text_preprocessing.py --use-config --csv ...
baseline_preprocessing:
  remove_urls: true
  collapse_whitespace: true
  normalize_unicode: true
  remove_emojis: false
  cyrillic_to_latin: true
  lowercase: true
  lemmatize: false
  # simplemma kod za BCMS; 'sr'/'hr'/'bs' se mapiraju na hbs
  lemma_lang: hbs

# =============================================================================
# Klasični ML baseline (TF-IDF + NB / LR / Linear SVM)
# =============================================================================
baselines:
  csv: data/processed/dataset/dataset.csv
  output_dir: models/baselines
  test_size: 0.2
  apply_preprocessing: true  # koristi baseline_preprocessing
  save_model: true
  tfidf:
    max_features: 20000
    ngram_range: [1, 2]
    min_df: 2
    max_df: 0.95
    sublinear_tf: true
  classifiers:
    naive_bayes:
      alpha: 1.0
    logistic_regression:
      C: 1.0
      max_iter: 2000
      class_weight: balanced
    linear_svm:
      C: 1.0
      max_iter: 5000
      class_weight: balanced

random_seed: 42

# =============================================================================
# Trening — deljene opcije (baseline + BERTić)
# =============================================================================
training:
  # true  → balanced class weights (baseline: class_weight / sample_weight;
  #         BERTić: weighted CrossEntropyLoss)
  # false → običan loss / bez class_weight
  use_class_weights: true

# =============================================================================
# Modeling (fine-tune)
# =============================================================================
modeling:
  model_name: classla/bcms-bertic
  max_length: 128
  batch_size: 8
  eval_batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_epochs: 4
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  # null = auto (cuda ako postoji, inače cpu)
  device: null
  output_dir: models
  # Fallback ako training.use_class_weights nije setovan (prioritet ima training:)
  use_class_weights: true
  use_weighted_sampler: true
  multitask:
    sentiment_loss_weight: 1.0
    sarcasm_loss_weight: 1.0
    dropout: 0.1
